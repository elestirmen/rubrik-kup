server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { types { application/manifest+json webmanifest; } default_type application/manifest+json; }

  location ~* \.(?:css|js)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
  location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }

  location / { try_files $uri $uri/ =404; }
}
